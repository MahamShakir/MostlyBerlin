
# ============================================================================
# application.yml — Shared base config across all profiles
# ============================================================================
# WHAT:    Common settings; profile-specific overrides live in
#          application-{dev,uat,prod}.yml.
# HOW:     Spring Boot loads `application.yml` first, then overlays the
#          active profile's file on top.
# WHY:     DRY — repeat only what changes per environment.
# OBSERVE: On startup, look for the line "The following 1 profile is active: dev"
#          (or uat/prod) to confirm the right config loaded.
# ============================================================================
server:
  port: 8081
spring:
  application:
    name: tradeflow
  profiles:
    # TODO(TICKET-I055): default to 'dev'. Override at runtime with
    # `SPRING_PROFILES_ACTIVE=uat ./mvnw spring-boot:run`.
    active: dev

  # ----------------------------------------------------------------------
  # Liquibase — TICKET-I009 (wire) / TICKET-I010 (run) / TICKET-I131 (CI)
  # ----------------------------------------------------------------------
  liquibase:
    enabled: true
    # Liquibase 4.24+ rejects the `classpath:` prefix here.
    # File is loaded from backend/src/main/resources/db/changelog/.
    change-log: db/changelog/db.changelog-master.xml

  # ----------------------------------------------------------------------
  # JPA — TICKET-I056..I059
  # ----------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: none           # Liquibase owns the schema, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # ----------------------------------------------------------------------
  # Kafka — TICKET-I113 (Day 9) + TICKET-I120 (observability)
  # ----------------------------------------------------------------------
  # bootstrap-servers  → env-driven, falls back to localhost for dev.
  # trusted.packages   → JsonDeserializer refuses to instantiate classes
  #                      outside this list (deserialization-gadget guard).
  # value.default.type → target type when the incoming payload has no
  #                      __TypeId__ header (set add.type.headers=false below).
  # producer.acks=all  → wait for all in-sync replicas before ack — the
  #                      strong durability posture. Combines with
  #                      idempotence for exactly-once within a partition.
  # ack-mode: record   → at-least-once — commit offset after every
  #                      successful handler return. I119's audit needs this.
  # observation-enabled → TICKET-I120: turn on Spring-Kafka Micrometer
  #                      integration so kafka_consumer_fetch_manager_records_lag
  #                      appears on /actuator/prometheus for I121's dashboard.
  # ----------------------------------------------------------------------
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.dbtraining.tradeflow.*"
        spring.json.value.default.type: "com.dbtraining.tradeflow.dto.TradeEvent"
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    listener:
      ack-mode: record            # at-least-once
      observation-enabled: true   # Micrometer metrics for I120 / I121

# ============================================================================
# Actuator — TICKET-I078 (Day 6) + verified for TICKET-I120 (Day 9)
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ============================================================================
# Springdoc / Swagger — TICKET-I063
# ============================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ============================================================================
# Custom app settings — Day 9 Kafka topic names (used by producer + consumers)
# ============================================================================
tradeflow:
  kafka:
    topics:
      trades: trade-events
      dlt: trade-events.DLT