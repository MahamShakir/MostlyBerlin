# ============================================================================
# application-dev.yml — Local development profile (TICKET-I055)
# ============================================================================
# WHAT:    Settings for `SPRING_PROFILES_ACTIVE=dev`.
# HOW:     Use H2 in-memory DB for fast iteration. Liquibase still runs.
# WHY:     Lets students run the app without a local PostgreSQL on Day 5.
# OBSERVE: Boot log says "H2 console available at /h2-console".
# ============================================================================

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.dbtraining.tradeflow.*"
        spring.json.value.default.type: "com.dbtraining.tradeflow.dto.TradeEvent"
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    listener:
      ack-mode: record            # at-least-once
      observation-enabled: true   # Micrometer metrics for I120

  tradeflow:
    kafka:
      topics:
        trades: trade-events
        dlt: trade-events.DLT
  datasource:
    url: jdbc:h2:mem:tradeflow;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: embedded
      # TICKET-I066: data.sql seeds dev with sample rows.
      # Spring Boot runs data.sql AFTER Liquibase by default — no need to
      # 'defer-datasource-initialization', and enabling it creates a circular
      # bean dependency (liquibase ↔ entityManagerFactory) in Boot 3.x.

logging:
  level:
    com.dbtraining.tradeflow: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
