# ============================================================================
# .github/workflows/ci.yml -- TICKET-I133 + TICKET-I134
# ============================================================================
# Triggers on every push (all branches) and on PRs targeting develop/main.
# Jobs:
#   1. lint                 -- fast style/format checks
#   2. backend-build-test   -- Maven build, unit + IT tests, Liquibase validate,
#                              JaCoCo coverage check (TICKET-I135 rule in pom.xml)
#   3. frontend-build-test  -- npm ci + build + tests
#   4. docker-build         -- multi-arch build, push to GHCR (develop/main only)
#
# On develop/main only, the docker-build job logs into ghcr.io using the
# auto-injected GITHUB_TOKEN (needs `permissions: packages: write`) and pushes
# each image tagged with BOTH `${{ github.sha }}` and `latest`.
# ============================================================================
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

# Repo-wide token defaults: read-only, and the docker-build job elevates to
# packages:write when it needs to push.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # --------------------------------------------------------------------------
  # 1. Lint -- format / style, fast fail
  # --------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make mvnw executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Backend -- maven validate
        working-directory: backend
        run: ./mvnw -B -e validate

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend -- npm ci (lockfile sanity)
        working-directory: frontend
        run: npm ci

  # --------------------------------------------------------------------------
  # 2. Backend build + test (with Postgres sidecar for Liquibase validate + ITs)
  # --------------------------------------------------------------------------
  backend-build-test:
    runs-on: ubuntu-latest
    needs: lint

    # Postgres sidecar -- reachable from the runner as localhost:5432
    # (NOT `postgres:5432` -- that's compose-network syntax).
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: tradeflow_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d tradeflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make mvnw executable
        working-directory: backend
        run: chmod +x mvnw
      
      - name: Build + run unit tests
        working-directory: backend
        run: ./mvnw -B -e clean verify

      # TICKET-I134: fail fast on malformed Liquibase XML.
      # liquibase:status is informational (lists pending changesets) -- useful
      # debugging on long changelogs. validate is the gate that fails the build.
      - name: Liquibase status (informational)
        working-directory: backend
        run: >
          ./mvnw -B liquibase:status
          -Dliquibase.url=jdbc:postgresql://localhost:5432/tradeflow_test
          -Dliquibase.username=ci
          -Dliquibase.password=ci
          -Dliquibase.changeLogFile=src/main/resources/db/changelog/db.changelog-master.xml

      - name: Liquibase validate
        working-directory: backend
        run: >
          ./mvnw -B liquibase:validate
          -Dliquibase.url=jdbc:postgresql://localhost:5432/tradeflow_test
          -Dliquibase.username=ci
          -Dliquibase.password=ci
          -Dliquibase.changeLogFile=src/main/resources/db/changelog/db.changelog-master.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  # --------------------------------------------------------------------------
  # 3. Frontend build + test
  # --------------------------------------------------------------------------
  frontend-build-test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: npm run build
        working-directory: frontend
        run: npm run build

      - name: npm test (if configured)
        working-directory: frontend
        run: |
          if npm run | grep -q "^  test$"; then
            npm test -- --run
          else
            echo "No test script defined -- skipping."
          fi

      - name: Upload frontend dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: warn
          retention-days: 7

  # --------------------------------------------------------------------------
  # 4. Docker build + push to GHCR (TICKET-I133)
  # --------------------------------------------------------------------------
  # Only pushes on develop/main -- feature branches skip the push to keep the
  # registry tidy. Both images tagged with the commit SHA (immutable audit
  # trail) AND `latest` (convenience for the demo laptop).
  # --------------------------------------------------------------------------
  docker-build:
    needs: [backend-build-test, frontend-build-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    # GHCR push needs packages:write. The default workflow token (GITHUB_TOKEN)
    # is read-only without this opt-in.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Auto-injected workflow token -- no PAT needed in CI.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase owner
        run: echo "OWNER_LC${OWNER,,}" >> $GITHUB_ENV
        env: 
          OWNER: ${{ github.repository_owner }}

      - name: Build + push backend image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/tradeflow-backend:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/tradeflow-backend:latest
          # Free Docker layer cache between CI runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push frontend image
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/tradeflow-frontend:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/tradeflow-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary -- pushed image refs
        run: |
          {
            echo "### Pushed images"
            echo ""
            echo "- \`ghcr.io/${{ github.repository_owner }}/tradeflow-backend:${{ github.sha }}\`"
            echo "- \`ghcr.io/${{ github.repository_owner }}/tradeflow-backend:latest\`"
            echo "- \`ghcr.io/${{ github.repository_owner }}/tradeflow-frontend:${{ github.sha }}\`"
            echo "- \`ghcr.io/${{ github.repository_owner }}/tradeflow-frontend:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"