# ============================================================================
# frontend/nginx.conf — TICKET-I126 + TICKET-I128
# ============================================================================
# WHAT:    Nginx server block for the production React UI.
# HOW:     SPA fallback + reverse proxy for the API.
# WHY:     One origin (no CORS), one image, easy to deploy.
# OBSERVE: GET /trades returns index.html (so React Router takes over).
#          GET /api/v1/trades is proxied to the backend container.
# ============================================================================
# frontend/nginx.conf — TICKET-I126
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip shaves first-paint time on the CSS/JS bundles.
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # SPA fallback — refreshing /trades must serve index.html, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy /api/ to the backend (Docker DNS resolves "backend").
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same for /actuator/ so health probes + Prometheus scrape work via nginx.
    location /actuator/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
