# ============================================================================
# docker-compose.yml — TradeFlow full-stack runtime
# ============================================================================
# This file is the SKELETON. By Day 10 you will fill in every service so that
# `docker compose up` brings up the whole platform end-to-end.
#
# TODO(TICKET-I127): wire all 7 services below + verify trade flow E2E.
# TODO(TICKET-I128): set up the docker network so services can resolve each
#                    other by name (e.g. backend can reach 'postgres', not
#                    'localhost').
#
# WHAT:    7 services: postgres, kafka, zookeeper, backend, frontend,
#          prometheus, grafana (+ kafdrop as an optional UI for Kafka).
# HOW:     Use service NAMES as DNS hostnames inside the compose network.
#          Mount the prometheus.yml from ./monitoring/prometheus/.
# WHY:     A single command must bring up the whole platform reproducibly
#          for the Day 10 final demo and for the CI/CD pipeline.
# OBSERVE: After `docker compose up -d` all 7 containers must reach the
#          'healthy' or 'running' state. The recon flow must work end-to-end.
# ============================================================================

version: "3.9"

services:
  # --------------------------------------------------------------------------
  # PostgreSQL — primary store for trades, counterparties, recon results
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: tradeflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradeflow}
      POSTGRES_USER: ${POSTGRES_USER:-tradeflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradeflow_user}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Kafka + Zookeeper (Day 9)
  # --------------------------------------------------------------------------
  # TODO(TICKET-I127): uncomment and wire Kafka + Zookeeper services.
  # HINT: use confluentinc/cp-kafka:7.5.0 + confluentinc/cp-zookeeper:7.5.0
  # HINT: KAFKA_ADVERTISED_LISTENERS must list BOTH internal (kafka:29092) and
  #       host-accessible (localhost:9092) listeners — otherwise the Spring
  #       Boot app inside Docker won't be able to reach the broker.
  #
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: tradeflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tradeflow-kafka
    depends_on: [ zookeeper ]
    ports: [ "9092:9092" ]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: tradeflow-kafdrop
    depends_on:
      kafka: { condition: service_healthy }
    ports: [ "9000:9000" ]
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx128M"
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Backend — Spring Boot recon-service
  # --------------------------------------------------------------------------
  # TODO(TICKET-I125 + TICKET-I127): build from ./backend/Dockerfile, depend on
  # postgres + kafka, expose 8080, point JDBC URL to 'postgres' (NOT localhost).
  #
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/your-org/tradeflow-backend:latest}
    container_name: tradeflow-backend
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports: [ "8080:8080" ]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-tradeflow}
      POSTGRES_USER: ${POSTGRES_USER:-tradeflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Frontend — React UI behind nginx
  # --------------------------------------------------------------------------
  # TODO(TICKET-I126 + TICKET-I127): build from ./frontend/Dockerfile, expose 80
  # (mapped to host 5173), depend on backend.
  #
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/your-org/tradeflow-frontend:latest}
    container_name: tradeflow-frontend
    depends_on:
      backend: { condition: service_healthy }
    ports: [ "5173:80" ]
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null 2>&1 || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Prometheus — scrapes /actuator/prometheus from backend
  # --------------------------------------------------------------------------
  # TODO(TICKET-I129): mount monitoring/prometheus/prometheus.yml read-only.
  # HINT: The scrape target inside the compose network is 'backend:8080',
  #       NOT 'localhost:8080'.
  #
  prometheus:
    image: prom/prometheus:latest
    container_name: tradeflow-prometheus
    depends_on:
      backend: { condition: service_healthy }
    ports: [ "9090:9090" ]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped
  # --------------------------------------------------------------------------
  # Grafana — dashboards for API + Kafka metrics
  # --------------------------------------------------------------------------
  # TODO(TICKET-I130): pre-provision the Prometheus datasource and the
  # default dashboard JSON via monitoring/grafana/provisioning/.
  #
  grafana:
    image: grafana/grafana:latest
    container_name: tradeflow-grafana
    depends_on: [ prometheus ]
    ports: [ "3000:3000" ]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres-data:
  # TODO(TICKET-I127): add 'kafka-data', 'grafana-data' as you add services.
  grafana-data:
